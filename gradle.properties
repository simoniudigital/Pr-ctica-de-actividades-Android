# Memoria asignada al demonio de Gradle durante la compilacion.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compila los modulos independientes en paralelo.
org.gradle.parallel=true

# AndroidX es obligatorio para las librerias de Material Design 3.
android.useAndroidX=true

# Genera solo los recursos realmente usados por cada variante.
android.nonTransitiveRClass=true

# JDK usado por Gradle. Android Studio 2026.1 incluye un JBR 25 que todavia no
# es compatible con el plugin de Android 8.7, por lo que se apunta al JDK 17
# instalado de forma independiente en este equipo.
org.gradle.java.home=C:/Program Files/Microsoft/jdk-17.0.20.101-hotspot

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
